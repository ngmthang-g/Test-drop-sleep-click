name: Test switch descendant graph

permissions:
  contents: write

on:
  push:
    branches: [ fix/switch-descendant-graph ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply descendant graph patch
        shell: pwsh
        run: |
          python tools/apply_switch_descendant_graph.py
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/bridge_chunks/bridge_13.txt tests/test_ui_direct_tab_contract.py
            git commit -m "fix: scan skillbar switch descendants at runtime"
            git push origin HEAD:fix/switch-descendant-graph
          }
      - name: UI direct source contract
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_ui_direct_tab_contract.py
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Smoke test main window startup
        shell: pwsh
        run: |
          $exe = Resolve-Path 'build/Release/ThanLongTestSell.exe'
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $idle = $p.WaitForInputIdle(5000)
            $p.Refresh()
            if ($p.HasExited) { throw "EXE exited during startup with code $($p.ExitCode)" }
            if (-not $idle) { throw 'EXE never reached input-idle state' }
            if ($p.MainWindowHandle -eq 0) { throw 'No main window handle after startup' }
            if ($p.MainWindowTitle -ne 'TEST BÁN ĐỒ • DROP SLEEP') { throw "Unexpected main window title: $($p.MainWindowTitle)" }
            Write-Host "STARTUP PASS HWND=$($p.MainWindowHandle) TITLE=$($p.MainWindowTitle)"
          }
          finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Verify no fixed Sleep
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem src/controller_chunks -File
            Get-ChildItem src/bridge_chunks -File | Where-Object { $_.Name -match '^bridge_(0[1-9]|1[0-3])\.txt$' }
            Get-Item src/protocol.h
            Get-Item src/internal_ui_click_logic.h
          )
          $hits = $files | Select-String -Pattern '\bSleep\s*\('
          if ($hits) { $hits | ForEach-Object { Write-Host $_ }; throw 'Sleep() found in source' }

name: Build TRADE STATE V4.1 PACKET

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select V4.1 resolver bridge
        shell: pwsh
        run: Copy-Item src/trade_packet_bridge_v41.cpp src/trade_packet_bridge.cpp -Force
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Stage V4.1 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/ThanLongTradePacketTest.exe package/ThanLongTradeStateTest.exe
          Copy-Item build/Release/ThanLongTradePacketBridge.dll package/
          Copy-Item TRADE_STATE_V41_PACKET.md package/
      - name: Upload V4.1 package
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-Trade-State-V4.1-Packet
          path: package/*
          if-no-files-found: error

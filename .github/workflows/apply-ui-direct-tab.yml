name: Apply TEST UI DIRECT tab

on:
  push:
    paths:
      - '.ui-direct/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-build-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply TEST UI DIRECT patch
        run: python tools/apply_ui_direct_tab.py
      - name: Verify contract GREEN
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_ui_direct_tab_contract.py
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Verify no fixed Sleep in ThanLongTestSell source
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem src/controller_chunks -File
            Get-ChildItem src/bridge_chunks -File | Where-Object { $_.Name -match '^bridge_(0[1-9]|1[0-3])\.txt$' }
            Get-Item src/protocol.h
            Get-Item src/internal_ui_click_logic.h
          )
          $hits = $files | Select-String -Pattern '\bSleep\s*\('
          if ($hits) { $hits | ForEach-Object { Write-Host $_ }; throw 'Sleep() found in ThanLongTestSell source' }
      - name: Stage UI Direct package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/ThanLongTestSell.exe package/
          Copy-Item build/Release/ThanLongTestSellBridge.dll package/
          Copy-Item build/Release/test_sell.ini package/
          Copy-Item README.md package/
          Copy-Item VERSION_REPORT.md package/
      - name: Upload UI Direct package
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-Test-Sell-UI-Direct-Test
          path: package/*
          if-no-files-found: error
      - name: Commit tested source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/protocol.h src/bridge_chunks/bridge_11.txt src/bridge_chunks/bridge_13.txt src/controller_chunks/controller_03.txt src/controller_chunks/controller_04.txt
          git commit -m "feat: add TEST UI DIRECT tab [skip ci]"
          git push

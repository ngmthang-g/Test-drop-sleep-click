name: Build TRADE STATE TEST

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Stage Trade test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/ThanLongTradeStateTest.exe package/
          Copy-Item build/Release/ThanLongTradeStateBridge.dll package/ThanLongTestSellBridge.dll
          Copy-Item TRADE_STATE_TEST.md package/
      - name: Upload Trade test EXE package
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-Trade-State-Test
          path: package/*
          if-no-files-found: error

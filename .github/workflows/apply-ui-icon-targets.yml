name: Apply UI icon targets

on:
  push:
    branches: [ feature/ui-direct-3-icons-correct-base ]
    paths:
      - 'tools/apply_ui_icon_targets.py'
      - '.github/workflows/apply-ui-icon-targets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-direct-3-icons-correct-base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch to startup-fixed source
        run: python tools/apply_ui_icon_targets.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/protocol.h src/bridge_chunks/bridge_13.txt src/controller_chunks/controller_03.txt
          git commit -m "feat: add bag and skill UI direct targets"
          git push origin HEAD:feature/ui-direct-3-icons-correct-base

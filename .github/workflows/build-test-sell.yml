name: Build TEST BAN DO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/ThanLongTestSell.exe package/
          Copy-Item build/Release/ThanLongTestSellBridge.dll package/
          Copy-Item build/Release/test_sell.ini package/
          if (Test-Path README.md) { Copy-Item README.md package/ }
      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-Test-Sell-NoSleep
          path: package/*
          if-no-files-found: error
